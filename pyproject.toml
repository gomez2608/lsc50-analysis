[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsc50-analysis"
version = "0.1.0"
description = "LSC50 — Colombian Sign Language (50 signs) multimodal analysis: IMU, landmarks, and video."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Gomez Ahumada" }]

[tool.setuptools.packages.find]
include = ["common*", "imu.src*", "landmarks.src*", "videos.src*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
